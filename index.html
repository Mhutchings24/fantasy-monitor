<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conorrhea HQ</title>
<meta name="theme-color" content="#1F6B45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conorrhea HQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --paper:#F3F5F0; --card:#FFFFFF; --ink:#14231C; --muted:#5A6B61; --line:#C9D2C8;
  --turf:#1F6B45; --turf-soft:#DCEBE1; --flag:#F2C230; --flag-ink:#3A2E00; --red:#C8372D; --red-soft:#F7DEDB;
  --chalk:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#0F1A14; --card:#16251D; --ink:#E8EFE9; --muted:#9DB0A4; --line:#2A3D32;
    --turf:#3FA06B; --turf-soft:#1C3A2A; --flag:#F2C230; --flag-ink:#2A2100; --red:#E5675E; --red-soft:#3A1E1B; --chalk:#E8EFE9; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:400 16px/1.5 Barlow,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.1;margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:var(--turf)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:#1F6B45;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.hd{max-width:680px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{font-size:28px;letter-spacing:.2px}
header .sub{font-size:14px;opacity:.85}
.fresh{font-size:13px;opacity:.85;text-align:right;white-space:nowrap}
.fresh.stale{color:var(--flag);opacity:1;font-weight:600}

main{max-width:680px;margin:0 auto;padding:16px}
section.tab{display:none}
section.tab.on{display:block}
h2{font-size:26px;margin:4px 0 12px}
h3{font-size:20px;margin:22px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* play call: the one loud thing on Today */
.play{background:var(--flag);color:var(--flag-ink);border-radius:4px 18px 4px 4px;padding:16px 16px 14px;margin-bottom:14px}
.play h2{font-size:30px;margin:0 0 6px;color:var(--flag-ink)}
.play ul{margin:0;padding-left:20px}
.play li{margin:4px 0;font-weight:500}
.play.calm{background:var(--turf-soft);color:var(--ink)}
.play.calm h2{color:var(--ink)}

.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--turf-soft);color:var(--ink)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.flag{background:var(--flag);color:var(--flag-ink)}
.out{color:var(--red);font-weight:600}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:9px 0;border-top:1px solid var(--line)}
ul.clean li:first-child{border-top:0}

/* field win-chance */
.field{position:relative;height:96px;border-radius:6px;overflow:hidden;background:#2E7D4F;margin:6px 0 4px}
.field .ez{position:absolute;top:0;bottom:0;width:9%;display:flex;align-items:center;justify-content:center;
  font:700 13px var(--cond);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px}
.field .ez.l{left:0;background:#7A2A24}.field .ez.r{right:0;background:#174F33}
.field .yl{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
.field .yn{position:absolute;bottom:4px;font:600 12px var(--cond);color:rgba(255,255,255,.8);transform:translateX(-50%)}
.field .ball{position:absolute;top:50%;width:30px;height:18px;margin:-9px 0 0 -15px;background:#8B4A22;border-radius:50%;
  box-shadow:0 0 0 2px #fff;transition:left 1.2s cubic-bezier(.2,.8,.2,1)}
.field .ball:after{content:"";position:absolute;left:8px;right:8px;top:8px;height:2px;background:#fff}
@media (prefers-reduced-motion:reduce){.field .ball{transition:none}}
.wc{font:700 44px/1 var(--cond);margin:4px 0}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font:600 14px var(--cond);color:var(--muted);border-top:0}
td.r,th.r{text-align:right}
.nw{white-space:nowrap}
tr.me td{background:var(--turf-soft);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--turf)}
.scroll{overflow-x:auto}

/* trade cards: give/get columns */
.trade .sides{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;margin:10px 0}
.trade .side h4{margin:0 0 4px;font:600 14px var(--cond);color:var(--muted)}
.trade .pl{font-weight:600;line-height:1.25}
.trade .pl span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.trade .swap{font:700 22px var(--cond);color:var(--muted);padding-top:18px}
.gain{font:700 22px var(--cond)}
.why{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}

/* reports */
.md h1{font-size:28px;margin:0 0 4px}.md h2{font-size:22px;margin:22px 0 8px}.md h3{font-size:18px;margin:16px 0 6px}
.md table{font-size:14px;display:block;overflow-x:auto}
.md td,.md th{white-space:nowrap}.md td:last-child{white-space:normal;min-width:180px}
.md em{color:var(--muted)}
.md ul{padding-left:20px}
.backlink{background:none;border:0;padding:0;color:var(--turf);font-weight:600;cursor:pointer;margin-bottom:10px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{background:none;border:0;padding:8px 0 9px;font:600 14px var(--cond);color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button[aria-selected=true]{color:var(--turf)}
nav button[aria-selected=true] svg{stroke-width:2.4}
.err{background:var(--red-soft);color:var(--red);padding:12px 14px;border-radius:8px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div><h1 id="teamName">Conorrhea HQ</h1><div class="sub" id="teamSub">Loading your league…</div></div>
    <div class="fresh" id="fresh"></div>
  </div>
</header>

<main>
  <div id="error"></div>
  <section class="tab on" id="t-today" aria-label="Today"></section>
  <section class="tab" id="t-matchup" aria-label="Matchup"></section>
  <section class="tab" id="t-trades" aria-label="Trades"></section>
  <section class="tab" id="t-waivers" aria-label="Waivers"></section>
  <section class="tab" id="t-league" aria-label="League"></section>
  <section class="tab" id="t-reports" aria-label="Reports"></section>
</main>

<nav><div class="in" role="tablist">
  <button role="tab" data-t="today" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 20V6l6 3 4-5 6 4v12z"/></svg>Today</button>
  <button role="tab" data-t="matchup"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5" transform="rotate(-35 12 12)"/><path d="M9.5 14.5l5-5M10.5 11l2.5 2.5"/></svg>Matchup</button>
  <button role="tab" data-t="trades"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Trades</button>
  <button role="tab" data-t="waivers"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6M19 4v5M16.5 6.5h5"/></svg>Waivers</button>
  <button role="tab" data-t="league"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>League</button>
  <button role="tab" data-t="reports"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>Reports</button>
</div></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
