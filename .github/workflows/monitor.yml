name: Fantasy monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a little late)
  workflow_dispatch: {}     # "Run workflow" button for a manual check

permissions:
  contents: write

concurrency:
  group: fantasy-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Today's date
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore player database (refreshed daily)
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ steps.day.outputs.d }}
          restore-keys: players-

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save results
        run: |
          git config user.name "fantasy-monitor"
          git config user.email "fantasy-monitor@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Update analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
