name: Fantasy monitor

# GitHub starts scheduled runs late and rarely on busy days (often about hourly).
# So each scheduled run keeps watching for ~55 minutes, checking every 5 minutes.
# Manual runs ("Run workflow", and the scheduled analysis tasks) do a single quick check.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fantasy-monitor-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Today's date
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore player database (refreshed daily)
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ steps.day.outputs.d }}
          restore-keys: players-

      - name: Watch the league
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOPS: ${{ github.event_name == 'schedule' && '11' || '1' }}
        run: |
          git config user.name "fantasy-monitor"
          git config user.email "fantasy-monitor@users.noreply.github.com"
          save() {
            git add data
            git diff --cached --quiet && return 0
            git commit -q -m "Update analysis $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && return 0
              sleep $((i * 4))
            done
            echo "push failed"; return 0
          }
          for n in $(seq 1 "$LOOPS"); do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            python monitor.py || echo "monitor exited with $?"
            save
            if [ "$n" -lt "$LOOPS" ]; then sleep 300; fi
          done
